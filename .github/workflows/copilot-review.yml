name: manual Copilot review
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Same-repository pull request number
        required: true
        type: string
      issue:
        description: Issue number containing the task contract
        required: true
        type: string
      plan_comment:
        description: Numeric ID of the approved plan comment on that issue
        required: true
        type: string
      head_sha:
        description: Exact 40-character PR head SHA selected for review
        required: true
        type: string
      publish:
        description: Publish a COMMENT review after generation
        default: false
        type: boolean
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: copilot-review-${{ inputs.pr }}
  cancel-in-progress: false
jobs:
  review:
    if: vars.AGENTIC_COPILOT_ACTIONS_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: copilot-review
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Only the trusted default branch is checked out. PR blobs are read as data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install verified Copilot CLI
        run: python scripts/agentic/install_tool.py copilot --directory "$RUNNER_TEMP/bin"
      - name: Prepare immutable review packet
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ inputs.pr }}
          REVIEW_ISSUE: ${{ inputs.issue }}
          REVIEW_PLAN: ${{ inputs.plan_comment }}
          REVIEW_SHA: ${{ inputs.head_sha }}
        run: |
          python scripts/agentic/review.py prepare "$REVIEW_PR" --issue "$REVIEW_ISSUE" --plan-comment "$REVIEW_PLAN" --expected-head "$REVIEW_SHA" --output "$RUNNER_TEMP/review"
      - name: Run independent Claude review through Copilot
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
        run: |
          test -n "$COPILOT_GITHUB_TOKEN" || { echo 'Set COPILOT_REVIEW_TOKEN in the copilot-review environment.' >&2; exit 1; }
          export PATH="$RUNNER_TEMP/bin:$PATH"
          python scripts/agentic/review.py run "$RUNNER_TEMP/review"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-review-${{ inputs.pr }}-${{ inputs.head_sha }}
          path: ${{ runner.temp }}/review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: review
    if: inputs.publish
    environment: copilot-review-publish
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: copilot-review-${{ inputs.pr }}-${{ inputs.head_sha }}
          path: ${{ runner.temp }}/review
      - name: Publish review against recorded head
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/agentic/review.py publish "$RUNNER_TEMP/review"
