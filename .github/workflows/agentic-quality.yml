name: agentic workflow tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agentic-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agentic-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - id: tests
        run: make check-agentic PYTHON=python RUFF=ruff
      - id: clean
        if: always()
        run: make check-clean PYTHON=python
      - name: Record exact hosted checkout and outcomes
        if: always()
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
        run: python scripts/agentic/ci_evidence.py --check agentic-quality --test-status "$TEST_OUTCOME" --clean-status "$CLEAN_OUTCOME" --output "$RUNNER_TEMP/validation/receipt.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-agentic-quality-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation/receipt.json
          if-no-files-found: error
          retention-days: 7
