name: Manuscript reproduction
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manuscript-${{ github.ref }}
  cancel-in-progress: true
jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install manuscript dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-publishers texlive-latex-extra texlive-science texlive-luatex texlive-fonts-recommended lmodern poppler-utils
          python -m pip install -r paper/requirements.txt
      - name: Reproduce isolated builds and the source ZIP
        run: python paper/scripts/build.py reproduce
      - name: Build current outputs and receipts
        run: python paper/scripts/build.py all
      - run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manuscript-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/paper/
          if-no-files-found: error
          retention-days: 7
