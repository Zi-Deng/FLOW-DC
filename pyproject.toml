[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-dc"
version = "4.0.0"
description = "Verifiable dataset acquisition with policy-aware adaptive request control"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["aiohttp>=3.13,<4", "polars>=1.37,<2", "tqdm>=4.67,<5", "yarl>=1.20,<2"]

[project.optional-dependencies]
formats = ["pandas>=2.3,<3", "pyarrow>=19", "lxml>=5", "fastexcel>=0.12"]
research = ["numpy==2.5.3", "scipy==1.18.0", "matplotlib==3.11.2", "Pillow==12.3.0", "psutil==7.2.1"]
dev = ["ruff==0.16.7", "PyYAML==6.0.3", "build>=1.2", "wheel>=0.45"]

[project.scripts]
flowdc = "flowdc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flowdc.ops" = ["runtime/*.py"]
"flowdc.distributed" = ["cctools.json"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/flowdc/ops/runtime/*.py" = ["ALL"]
"tests/ops/*.py" = ["E402", "B023"]

[tool.ruff.format]
quote-style = "double"
exclude = ["src/flowdc/ops/runtime"]
